<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Volpets to discuss private dog care membership in London.">
    <title>Volpets | Contact</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="components/navbar.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div id="nav-placeholder"></div>
      </header>

      <section class="hero-content hero-content--pending" data-lazy-reveal>
        <p class="subtitle">Membership &middot; Enquiries &middot; London</p>
        <h1 class="headline">Let&rsquo;s talk about your dog.</h1>
        <p class="description">
          Get in touch to discuss your dog&rsquo;s needs, your routine and whether Volpets is the right fit.
        </p>

        <form id="contact-form" class="contact-form">
          <div class="contact-form__field">
            <label for="contact-name">Your name</label>
            <input id="contact-name" name="from_name" type="text" autocomplete="name" required>
          </div>

          <div class="contact-form__field">
            <label for="contact-email">Your email</label>
            <input id="contact-email" name="from_email" type="email" autocomplete="email" required>
          </div>

          <div class="contact-form__field">
            <label for="contact-message">How can we help?</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
          </div>

          <div class="contact-form__honeypot" aria-hidden="true">
            <label for="contact-website">Website</label>
            <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <button id="submit-btn" class="contact-form__submit" type="submit">Send message</button>
          <p id="contact-form-status" class="contact-form__status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
