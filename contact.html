<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="Contact Volpets to discuss private dog care membership in London." name="description">
  <title>Volpets | Contact</title>
  <link href="css/styles.css" rel="stylesheet">
  <link href="css/contact.css" rel="stylesheet">
  <link href="components/navbar.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script defer src="js/main.js"></script>
</head>
<body>
<main>
  <header>
    <div id="nav-placeholder"></div>
  </header>
  <section class="page-section" data-lazy-reveal>
    <div class="container">
      <p class="header-tag">PRIVATE ENQUIRIES</p>
      <h1 class="headline">A more considered kind of dog care.</h1>
      <p class="subtitle">Contact VolPets to discuss your dog, routine and suitability for membership.</p>

      <form class="contact-form" id="contact-form">
        <div class="contact-form__field">
          <label for="contact-name">Your name</label>
          <input autocomplete="name" id="contact-name" name="from_name" required type="text">
        </div>

        <div class="contact-form__field">
          <label for="contact-email">Your email</label>
          <input autocomplete="email" id="contact-email" name="from_email" required type="email">
        </div>

        <div class="contact-form__field">
          <label for="contact-message">How can we help?</label>
          <textarea id="contact-message" name="message" required rows="5"></textarea>
        </div>

        <div aria-hidden="true" class="contact-form__honeypot">
          <label for="contact-website">Website</label>
          <input autocomplete="off" id="contact-website" name="website" tabindex="-1" type="text">
        </div>

        <button class="contact-form__submit" id="submit-btn" type="submit">Send message</button>
        <p aria-live="polite" class="contact-form__status" id="contact-form-status" role="status"></p>
      </form>
    </div>
  </section>
</main>
</body>
</html>
